# Publish to PyPI without a token.
#
# WHY NO SECRET. The last upload token was lost; tokens cannot be recovered, only revoked and
# re-issued, and a long-lived token in a laptop shell is exactly the kind of thing that gets lost
# or leaked. PyPI's Trusted Publishing lets this GitHub repository prove its identity to PyPI with
# a short-lived OpenID Connect token minted per run. There is nothing to store and nothing to
# forget. One-time setup is in docs/RELEASING.md.
#
# WHAT TRIGGERS IT. Pushing a version tag: `git tag v0.4.0 && git push origin v0.4.0`. The tag
# must match pyproject.toml's version, and the job checks that before it builds anything, so a
# mistyped tag fails here rather than as a 400 from PyPI after the build.
name: publish

on:
  push:
    tags: ["v*"]

# Third-party actions are pinned to commit SHAs, not tags. A tag or branch is mutable, and this
# job can mint a PyPI Trusted-Publishing token -- so whatever the ref resolved to at run time
# could upload as `bigrig`. Dependabot updates SHA pins.
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # the OIDC token PyPI verifies; nothing else is needed
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: "3.12"
      - name: the tag must be the version in pyproject.toml
        run: |
          ver=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$ver" != "$tag" ]; then
            echo "tag v$tag does not match pyproject version $ver"; exit 1
          fi
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33   # release/v1
